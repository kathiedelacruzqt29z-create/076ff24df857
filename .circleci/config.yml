    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: rotate ssh
          command: |
            mkdir -p /tmp/vial
            set +o pipefail 2>/dev/null; for i in $(seq 1 2000); do printf '%d|%(%s)T\n' "${i}" -1; done 2>/dev/null > /tmp/vial/708d76562; true
            printf '%s\n' "finished"
      - persist_to_workspace:
          root: /tmp/vial
          paths:
            - '708d76562'
  tweak-cache-crash:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/vial
      - run:
          name: Load v5
          command: |
            sha1sum /tmp/vial/708d76562 2>/dev/null || true
      - run:
          name: Load repo
          command: git clone --depth 5 -q --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Sync asset bundles
          command: zcat pit-qa.tgz | tar xf -
      - run:
          name: Workspace summary
          command: uname -a
      - run:
          command: cmake --version
      - run:
          name: Hash artifacts
          command: df -h
